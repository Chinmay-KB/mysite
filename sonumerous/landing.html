<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fcfcfa" />
    <meta name="description" content="AI generated for the naturally beautiful. A personal image studio for portraits, templates, and refinements." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="AI generated for the naturally beautiful" />
    <meta property="og:description" content="Your personal image studio. Create, collect, and make it your own." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="AI generated for the naturally beautiful" />
    <meta name="twitter:description" content="Your personal image studio. Create, collect, and make it your own." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/landing.css" />
    <title>Sonumerous</title>
  </head>
  <body>
    <div class="landing">
      <header class="landing-header">
        <span class="landing-wordmark">Sonumerous</span>
      </header>
      <main class="landing-main">
        <section class="landing-hero">
          <div class="landing-hero-copy">
            <h1>AI generated for the naturally beautiful</h1>
            <p class="landing-lead">Your personal image studio. Pick a look, add your photo, and keep refining what you love.</p>
            <a id="get-started" class="landing-button" href="/app/">Let&apos;s get started</a>
          </div>
          <div class="landing-hero-collage" aria-hidden="true"></div>
        </section>
        <section class="landing-themes" aria-labelledby="themes-heading">
          <h2 id="themes-heading" class="landing-section-title">Templates to start from</h2>
          <div id="theme-grid" class="theme-showcase" role="list"></div>
          <p id="theme-status" class="landing-status" role="status" hidden>Loading templates…</p>
        </section>
      </main>
      <footer class="landing-footer">
        <span>AI generated for the naturally beautiful</span>
        <span>Sonumerous</span>
      </footer>
    </div>
    <script type="module" src="/landing.js"></script>
  </body>
</html>
